name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/BetterAccounting.sln
      
    - name: Build
      run: dotnet build src/BetterAccounting.sln --no-restore --configuration Release
      
    - name: Run Tests
      run: dotnet test src/BetterAccounting.sln --no-build --verbosity normal
      
    - name: Publish Single-File Executable
      run: dotnet publish src/UI/UI.csproj --configuration Release --runtime win-x64 --output ./publish
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: betteraccounting-windows-single-file
        path: ./publish/BetterAccounting.exe