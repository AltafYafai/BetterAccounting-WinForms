name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/UI/UI.csproj -r win-x64
      
    - name: Restore test dependencies
      run: dotnet restore tests/Core.Tests/Core.Tests.csproj
      
    - name: Build Core
      run: dotnet build src/Core/Core.csproj --no-restore --configuration Release
      
    - name: Build UI
      run: dotnet build src/UI/UI.csproj --no-restore --configuration Release -r win-x64
      
    - name: Run Tests
      run: dotnet test tests/Core.Tests/Core.Tests.csproj --configuration Release --verbosity normal
      
    - name: Publish Single-File Executable
      run: dotnet publish src/UI/UI.csproj --configuration Release --runtime win-x64 --output ./publish
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: betteraccounting-windows-single-file
        path: ./publish/BetterAccounting.exe