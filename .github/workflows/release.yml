name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore src/BetterAccounting.sln
      
    - name: Build
      run: dotnet build src/BetterAccounting.sln --no-restore --configuration Release
      
    - name: Publish Single-File Executable
      run: dotnet publish src/UI/UI.csproj --configuration Release --runtime win-x64 --output ./publish
      
    - name: Inspect Publish Output
      run: dir publish
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/*.exe
        name: BetterAccounting ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true